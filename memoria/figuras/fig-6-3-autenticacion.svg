<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="13" font-weight="bold">Inicio de sesión</text>
  <text x="20" y="150" font-size="13" font-weight="bold">Renovación de sesión</text>

  <g stroke="#000000" stroke-width="1" fill="none">
    <!-- Row 1 -->
    <rect x="30" y="45" width="150" height="50"/>
    <rect x="255" y="45" width="170" height="50"/>
    <rect x="500" y="45" width="150" height="50"/>
    <line x1="180" y1="70" x2="253" y2="70" marker-end="url(#arr)"/>
    <line x1="425" y1="70" x2="498" y2="70" marker-end="url(#arr)"/>
    <!-- Row 2 -->
    <rect x="30" y="165" width="150" height="50"/>
    <rect x="255" y="165" width="170" height="50"/>
    <rect x="500" y="165" width="150" height="50"/>
    <line x1="180" y1="190" x2="253" y2="190" marker-end="url(#arr)"/>
    <line x1="425" y1="190" x2="498" y2="190" marker-end="url(#arr)"/>
  </g>

  <g fill="#000000" text-anchor="middle" font-size="12">
    <!-- Row 1 boxes -->
    <text x="105" y="66">Cliente</text>
    <text x="105" y="82">(credenciales)</text>
    <text x="340" y="66">Servidor:</text>
    <text x="340" y="82">valida y firma</text>
    <text x="575" y="66">Sesión iniciada</text>
    <text x="575" y="82">(access + refresh)</text>
    <!-- Row 2 boxes -->
    <text x="105" y="186">Access token</text>
    <text x="105" y="202">expirado</text>
    <text x="340" y="186">Servidor: verifica</text>
    <text x="340" y="202">identificador y rota</text>
    <text x="575" y="186">Sesión mantenida</text>
    <text x="575" y="202">(nuevo par)</text>
    <!-- Arrow labels -->
    <text x="216" y="64" font-size="11">credenciales</text>
    <text x="461" y="64" font-size="11">access +</text>
    <text x="461" y="76" font-size="11">refresh</text>
    <text x="216" y="184" font-size="11">refresh</text>
    <text x="461" y="184" font-size="11">nuevo</text>
    <text x="461" y="196" font-size="11">par</text>
  </g>
</svg>
