<svg xmlns="http://www.w3.org/2000/svg" width="820" height="352" viewBox="0 0 820 352" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="352" fill="#ffffff"/>

  <!-- Month header -->
  <g fill="#000000" font-size="12" text-anchor="middle">
    <text x="275" y="34">Nov</text>
    <text x="345" y="34">Dic</text>
    <text x="415" y="34">Ene</text>
    <text x="485" y="34">Feb</text>
    <text x="555" y="34">Mar</text>
    <text x="625" y="34">Abr</text>
    <text x="695" y="34">May</text>
    <text x="765" y="34">Jun</text>
  </g>

  <!-- Grid vertical lines (x = 240 + 70*i) -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="240" y1="44" x2="240" y2="330"/>
    <line x1="310" y1="44" x2="310" y2="330"/>
    <line x1="380" y1="44" x2="380" y2="330"/>
    <line x1="450" y1="44" x2="450" y2="330"/>
    <line x1="520" y1="44" x2="520" y2="330"/>
    <line x1="590" y1="44" x2="590" y2="330"/>
    <line x1="660" y1="44" x2="660" y2="330"/>
    <line x1="730" y1="44" x2="730" y2="330"/>
    <line x1="800" y1="44" x2="800" y2="330"/>
  </g>

  <!-- Task rows -->
  <g fill="#000000" font-size="12">
    <text x="12" y="66">Análisis y diseño inicial</text>
    <text x="12" y="104">Iteración 1 — Núcleo</text>
    <text x="12" y="142">Iteración 2 — Organización</text>
    <text x="12" y="180">Iteración 3 — Económicos y seguim.</text>
    <text x="12" y="218">Iteración 4 — Avanzadas e IA</text>
    <text x="12" y="256">Pruebas y validación</text>
    <text x="12" y="294">Redacción de la memoria</text>
  </g>

  <!-- Bars: x = 240 + 70*start, width = 70*(end-start) -->
  <g fill="#c9c9c9" stroke="#000000" stroke-width="1">
    <rect x="240" y="52"  width="140" height="20"/>
    <rect x="310" y="90"  width="140" height="20"/>
    <rect x="380" y="128" width="140" height="20"/>
    <rect x="450" y="166" width="140" height="20"/>
    <rect x="520" y="204" width="140" height="20"/>
    <rect x="590" y="242" width="140" height="20"/>
    <rect x="520" y="280" width="280" height="20"/>
  </g>

  <!-- Bottom baseline -->
  <line x1="240" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1"/>
</svg>
