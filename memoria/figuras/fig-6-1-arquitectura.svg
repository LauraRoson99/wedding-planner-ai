<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <g stroke="#000000" stroke-width="1" fill="none">
    <!-- Cliente -->
    <rect x="200" y="30" width="240" height="66"/>
    <!-- arrow cliente -> servidor -->
    <line x1="320" y1="96" x2="320" y2="150" marker-end="url(#arr)"/>
    <!-- Servidor -->
    <rect x="150" y="155" width="340" height="182"/>
    <rect x="180" y="194" width="280" height="32"/>
    <rect x="180" y="236" width="280" height="32"/>
    <rect x="180" y="278" width="280" height="32"/>
    <!-- arrow servidor -> BBDD -->
    <line x1="320" y1="337" x2="320" y2="378" marker-end="url(#arr)"/>
    <!-- BBDD -->
    <rect x="235" y="382" width="170" height="56"/>
    <!-- external services -->
    <rect x="505" y="196" width="120" height="42"/>
    <rect x="505" y="262" width="120" height="42"/>
    <line x1="490" y1="217" x2="503" y2="217" marker-end="url(#arr)"/>
    <line x1="490" y1="283" x2="503" y2="283" marker-end="url(#arr)"/>
  </g>

  <g fill="#000000" text-anchor="middle">
    <text x="320" y="56" font-size="14" font-weight="bold">Cliente (navegador)</text>
    <text x="320" y="76" font-size="13">Aplicación React (SPA)</text>

    <text x="320" y="178" font-size="14" font-weight="bold">Servidor — Node.js + Express</text>
    <text x="320" y="214" font-size="13">Rutas</text>
    <text x="320" y="256" font-size="13">Controladores (validación)</text>
    <text x="320" y="298" font-size="13">Servicios (lógica de negocio)</text>

    <text x="320" y="406" font-size="13" font-weight="bold">Base de datos</text>
    <text x="320" y="424" font-size="13">PostgreSQL</text>

    <text x="565" y="213" font-size="12">API de IA</text>
    <text x="565" y="229" font-size="12">(OpenAI)</text>
    <text x="565" y="279" font-size="12">Correo</text>
    <text x="565" y="295" font-size="12">(SMTP)</text>
  </g>

  <g fill="#000000" text-anchor="start" font-size="12">
    <text x="330" y="118">REST / JSON (HTTPS)</text>
    <text x="330" y="134">Bearer token</text>
    <text x="330" y="362">Prisma ORM</text>
  </g>
</svg>
